<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 30px 30px;
  color: #fff;
  width: 600px;
}
.panel {
  background: #16213e;
  border-radius: 24px;
  padding: 40px 32px 32px;
  width: 540px;
  position: relative;
  border: 2px solid #2a2a5a;
}
.panel-number {
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 22px;
}
.panel-title {
  text-align: center;
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 24px;
  letter-spacing: 1px;
}
.scene {
  position: relative;
  height: 480px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.iphone {
  width: 90px;
  height: 165px;
  background: #333;
  border-radius: 18px;
  border: 3px solid #555;
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}
.iphone .screen {
  width: 72px;
  height: 128px;
  background: #0f3460;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.iphone .bt-icon { font-size: 36px; color: #3498db; }
.iphone .notch {
  position: absolute;
  top: 5px;
  width: 34px;
  height: 7px;
  background: #222;
  border-radius: 4px;
}
.app-zukka, .app-dexcom {
  width: 80px;
  height: 80px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  text-align: center;
  line-height: 1.2;
  position: absolute;
  z-index: 2;
}
.app-zukka {
  background: linear-gradient(135deg, #2ecc71, #27ae60);
  border: 2px solid #1abc9c;
}
.app-dexcom {
  background: linear-gradient(135deg, #3498db, #2980b9);
  border: 2px solid #5dade2;
}
.sensor {
  width: 68px;
  height: 68px;
  background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: #333;
  text-align: center;
  line-height: 1.2;
  position: absolute;
  border: 2px solid #95a5a6;
  z-index: 2;
}
.speech {
  position: absolute;
  background: #fff;
  color: #333;
  padding: 8px 14px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
  z-index: 4;
}
.speech::after {
  content: '';
  position: absolute;
  width: 0;
  height: 0;
}
.speech.left::after {
  right: -10px;
  top: 50%;
  transform: translateY(-50%);
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
  border-left: 10px solid #fff;
}
.speech.right::after {
  left: -10px;
  top: 50%;
  transform: translateY(-50%);
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
  border-right: 10px solid #fff;
}
.speech.angry { background: #ffe0e0; color: #c0392b; }
.speech.angry.left::after { border-left-color: #ffe0e0; }
.speech.angry.right::after { border-right-color: #ffe0e0; }
.speech.happy { background: #e0ffe0; color: #27ae60; }
.speech.happy.left::after { border-left-color: #e0ffe0; }
.speech.happy.right::after { border-right-color: #e0ffe0; }
.blocked {
  position: absolute;
  font-size: 48px;
  color: #e94560;
  font-weight: 900;
  z-index: 3;
  text-shadow: 0 0 12px rgba(233, 69, 96, 0.6);
}
.bt-bolt {
  position: absolute;
  font-size: 22px;
  z-index: 3;
}
.caption {
  text-align: center;
  font-size: 18px;
  color: #ccc;
  margin-top: 20px;
  line-height: 1.6;
}
.caption strong { color: #ffcc00; }
.caption .red { color: #e94560; }
.caption .green { color: #2ecc71; }
.caption .blue { color: #5dade2; }
.mode-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1px;
}
.mode-master { background: #e94560; color: #fff; }
.mode-follower { background: #2ecc71; color: #fff; }
svg.conn-svg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
  pointer-events: none;
}
</style>
</head>
<body>
<div class="panel">
  
    <div class="panel-number" style="background:#e94560;">1</div>
    <div class="panel-title" style="color:#e94560;">THE PROBLEM</div>
    
  <div class="scene">
    
    <!-- Sensor -->
    <div class="sensor" style="top:6px; left:50%; transform:translateX(-50%);">Dexcom<br>G7</div>

    <!-- BT line sensor to phone -->
    <div style="position:absolute; top:74px; left:50%; width:0; height:30px; border-left:3px dashed #3498db;"></div>
    <div class="bt-bolt" style="top:78px; left:47%; color:#3498db;">&#x26A1;</div>

    <!-- iPhone -->
    <div class="iphone" style="top:100px; left:50%; transform:translateX(-50%);">
      <div class="notch"></div>
      <div class="screen"><div class="bt-icon">&#x1F4F6;</div></div>
    </div>

    <!-- ONLY 1 BT SLOT badge -->
    <div style="position:absolute; top:86px; left:50%; transform:translateX(-50%); background:#e94560; color:#fff; font-size:13px; font-weight:700; padding:4px 10px; border-radius:6px; white-space:nowrap; z-index:5;">
      ONLY 1 BT SLOT!
    </div>

    <!-- Connection lines -->
    <svg class="conn-svg">
      <line x1="55" y1="370" x2="210" y2="265" stroke="#5dade2" stroke-width="2.5" stroke-dasharray="5,4"/>
      <line x1="425" y1="370" x2="270" y2="265" stroke="#e94560" stroke-width="2" stroke-dasharray="5,4" opacity="0.4"/>
    </svg>

    <!-- Speech bubbles -->
    <div class="speech angry left" style="left:10px; top:310px;">It's MINE!</div>
    <div class="speech angry right" style="right:10px; top:310px;">I can't connect!</div>

    <!-- App icons -->
    <div class="app-dexcom" style="left:12px; top:355px;">Dexcom<br>App</div>
    <div class="app-zukka" style="right:12px; top:355px; opacity:0.5;">Zukka</div>

    <!-- Blocked X -->
    <div class="blocked" style="right:100px; top:365px;">&#x2717;</div>

    <!-- Emojis -->
    <div style="position:absolute; left:22px; top:442px;"><svg width="44" height="44" viewBox="0 0 36 36"><circle cx="18" cy="18" r="17" fill="#FFCC4D"/><circle cx="12" cy="15" r="2.5" fill="#664500"/><circle cx="24" cy="14" r="2.5" fill="#664500"/><path d="M10 23 Q18 27 26 23" stroke="#664500" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M9 12 L16 14" stroke="#664500" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></div>
    <div style="position:absolute; right:22px; top:442px;"><svg width="44" height="44" viewBox="0 0 36 36"><circle cx="18" cy="18" r="17" fill="#FFCC4D"/><ellipse cx="12" cy="15" rx="2.5" ry="3" fill="#664500"/><ellipse cx="24" cy="15" rx="2.5" ry="3" fill="#664500"/><path d="M12 25 Q18 21 24 25" stroke="#664500" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M8 17 L11 19" stroke="#5DADEC" stroke-width="2" fill="none"/><circle cx="8" cy="20" r="2" fill="#5DADEC" opacity="0.6"/></svg></div>
    
  </div>
  <div class="caption">
    
    iPhone allows <span class="red">only ONE</span> Bluetooth<br>
    connection to the CGM sensor.<br>
    Dexcom hogs it. Zukka is locked out.
    
  </div>
</div>
</body>
</html>
